name: Relatório de bug
description: Algo não funcionou como esperado
labels: ["bug"]
body:
  - type: dropdown
    id: fonte
    attributes:
      label: Fonte de dados
      options:
        - IBGE/SIDRA
        - Banco Central (SGS/PTAX/Focus)
        - INMET
        - Câmara dos Deputados
        - Outra / não sei dizer
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Ferramenta chamada
      placeholder: ex.: bcb_serie
    validations:
      required: true
  - type: textarea
    id: parametros
    attributes:
      label: Parâmetros usados
      placeholder: |
        indicador="ipca", data_inicial="2026-01-01"
    validations:
      required: true
  - type: textarea
    id: erro
    attributes:
      label: Erro ou saída inesperada
      description: Cole a mensagem completa. Dica: rode o servidor com MCP_LOG_LEVEL=DEBUG
    validations:
      required: true
  - type: input
    id: cliente
    attributes:
      label: Cliente MCP
      placeholder: ex.: Claude Desktop, Cursor, Claude Code
