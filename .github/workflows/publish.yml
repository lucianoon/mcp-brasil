name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist e wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Confere se a tag bate com a versao do pyproject
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$tag  pyproject=$proj"
          test "$tag" = "$proj" || { echo "::error::Tag $tag difere da versao $proj no pyproject.toml"; exit 1; }

      - name: Build
        run: uv build

      - name: Checa metadados do pacote
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publica no PyPI (Trusted Publishing)
    needs: build
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-dados-br
    permissions:
      id-token: write      # exigido pelo OIDC do Trusted Publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Sem password e sem secrets: a autenticacao e feita via OIDC do GitHub.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
